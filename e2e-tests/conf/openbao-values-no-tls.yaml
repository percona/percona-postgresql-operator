global:
  tlsDisable: true
  openshift: <openshift>

injector:
  enabled: false

server:
  image:
    registry: quay.io
    repository: openbao/openbao
  dataStorage:
    enabled: true
    size: 1Gi
  standalone:
    enabled: true
    config: |
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }
  ha:
    enabled: false
