apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 180
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions
      init_temp_dir # do this only in the first TestStep

      PGO_FEATURE_GATES="BackupSnapshots=true" deploy_operator
      deploy_client
      deploy_s3_secrets
      platform="${PLATFORM}"
      ensure_ebs_gp3_storage_class "$platform"
      deploy_volume_snapshot_class "$platform"
