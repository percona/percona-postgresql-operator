---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap-tls
  labels:
    app.kubernetes.io/name: openldap-tls
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openldap-tls
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openldap-tls
    spec:
      serviceAccountName: openldap-tls
      containers:
        # osixia/openldap v2 runs as non-root and listens on 3890 (LDAP) and
        # 6360 (LDAPS). The Service still exposes 389 and 636.
        - name: openldap
          image: docker.io/osixia/openldap:latest
          imagePullPolicy: Always
          env:
            - name: OPENLDAP_BOOTSTRAP_ORGANIZATION
              value: "ldap.local"
            - name: OPENLDAP_BOOTSTRAP_SUFFIX
              value: "dc=ldap,dc=local"
            # {SSHA} hash of "adminpassword".
            - name: OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED
              value: "{SSHA}XyAanpFfmRWI+E9FQRdgfkrrdfVsZGFw"
            - name: OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED
              value: "{SSHA}XyAanpFfmRWI+E9FQRdgfkrrdfVsZGFw"
            - name: OPENLDAP_BOOTSTRAP_TLS
              value: "true"
            - name: OPENLDAP_BOOTSTRAP_TLS_VERIFY_CLIENT
              value: "never"
            # Leave plaintext LDAP available so ldap-setup can load entries.
            - name: OPENLDAP_BOOTSTRAP_TLS_REQUIRED
              value: "false"
            # 3.3 is TLS 1.2. The image default (3.4) allows only TLS 1.3.
            - name: OPENLDAP_BOOTSTRAP_TLS_PROTOCOL_MIN
              value: "3.3"
            - name: OPENLDAP_URLS
              value: "ldap://:3890 ldaps://:6360 ldapi:///"
          ports:
            - name: tcp-ldap
              containerPort: 3890
            - name: tls-ldap
              containerPort: 6360
          volumeMounts:
            - name: ldap-ca
              mountPath: /container/services/openldap/assets/certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: tls-ldap
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: tls-ldap
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: ldap-setup
          image: docker.io/osixia/openldap:latest
          imagePullPolicy: Always
          command: ["/bin/bash"]
          args:
            - -c
            - |
              set -eu

              echo "Waiting for LDAP server to be ready..."
              ready=0
              for i in $(seq 30); do
                if ldapsearch -x -H ldap://localhost:3890 \
                  -D "cn=admin,dc=ldap,dc=local" -w adminpassword \
                  -b "dc=ldap,dc=local" 2>&1 | grep -q "numEntries"; then
                  ready=1
                  break
                fi
                echo "Attempt ${i}: LDAP server not ready yet, waiting..."
                sleep 5
              done
              if [[ "${ready}" -ne 1 ]]; then
                echo "LDAP server did not become ready" >&2
                exit 1
              fi

              echo "Adding LDAP structure..."
              ldapadd -x -H ldap://localhost:3890 -D "cn=admin,dc=ldap,dc=local" -w adminpassword <<'EOF'
              dn: ou=perconadba,dc=ldap,dc=local
              objectClass: organizationalUnit
              ou: perconadba

              dn: uid=percona,ou=perconadba,dc=ldap,dc=local
              objectClass: inetOrgPerson
              uid: percona
              cn: percona
              sn: percona
              userPassword: mysecretpassword

              dn: cn=admin,ou=perconadba,dc=ldap,dc=local
              objectClass: groupOfUniqueNames
              cn: admin
              uniqueMember: uid=percona,ou=perconadba,dc=ldap,dc=local
              EOF

              echo "LDAP structure added successfully"
              sleep infinity
      volumes:
        - name: ldap-ca
          secret:
            secretName: ldap-ca
---
apiVersion: v1
kind: Service
metadata:
  name: openldap-tls
  labels:
    app.kubernetes.io/name: openldap-tls
spec:
  type: ClusterIP
  ports:
    - name: tls-ldap
      port: 636
      targetPort: tls-ldap
    - name: tcp-ldap
      port: 389
      targetPort: tcp-ldap
  selector:
    app.kubernetes.io/name: openldap-tls
