apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      add_arch_to_pg_upgrade - <<-EOF | kubectl apply -n ${NAMESPACE} -f -
        apiVersion: pgv2.percona.com/v2
        kind: PerconaPGUpgrade
        metadata:
          name: 15-to-16-postgis
        spec:
          postgresClusterName: major-upgrade-15-to-16-postgis
          image: ${IMAGE_UPGRADE}
          fromPostgresVersion: 15
          toPostgresVersion: 16
          toPostgresImage: $(get_container_image "postgis" 16)
          toPgBouncerImage: $(get_container_image "pgbouncer" 16)
          toPgBackRestImage: $(get_container_image "pgbackrest" 16)
      EOF
