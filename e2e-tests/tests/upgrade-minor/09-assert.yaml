apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: upgrade-minor-repo-host
  labels:
    app.kubernetes.io/instance: upgrade-minor
    app.kubernetes.io/managed-by: percona-postgresql-operator
    app.kubernetes.io/name: percona-postgresql
    app.kubernetes.io/part-of: percona-postgresql
    postgres-operator.crunchydata.com/cluster: upgrade-minor
    postgres-operator.crunchydata.com/data: pgbackrest
    postgres-operator.crunchydata.com/pgbackrest: ''
    postgres-operator.crunchydata.com/pgbackrest-dedicated: ''
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: upgrade-minor
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 2
  replicas: 1
  readyReplicas: 1
  currentReplicas: 1
  updatedReplicas: 1
  collisionCount: 0
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  # 3 = create + restore shutdown/startup (step 08) + image change (step 09);
  # the restore-target instance is recreated from scratch and ends up at 2,
  # kuttl only needs one of the three instance STS to match this entry
  generation: 3
  labels:
    app.kubernetes.io/component: pg
    app.kubernetes.io/instance: upgrade-minor
    app.kubernetes.io/managed-by: percona-postgresql-operator
    app.kubernetes.io/name: percona-postgresql
    app.kubernetes.io/part-of: percona-postgresql
    postgres-operator.crunchydata.com/cluster: upgrade-minor
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: upgrade-minor
      controller: true
      blockOwnerDeletion: true
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: pg
        app.kubernetes.io/instance: upgrade-minor
        app.kubernetes.io/managed-by: percona-postgresql-operator
        app.kubernetes.io/name: percona-postgresql
        app.kubernetes.io/part-of: percona-postgresql
        postgres-operator.crunchydata.com/cluster: upgrade-minor
        postgres-operator.crunchydata.com/data: postgres
        postgres-operator.crunchydata.com/instance-set: instance1
        postgres-operator.crunchydata.com/patroni: upgrade-minor-ha
status:
  availableReplicas: 1
  collisionCount: 0
  observedGeneration: 3
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: upgrade-minor-pgbouncer
  labels:
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/instance: upgrade-minor
    app.kubernetes.io/managed-by: percona-postgresql-operator
    app.kubernetes.io/name: percona-postgresql
    app.kubernetes.io/part-of: percona-postgresql
    postgres-operator.crunchydata.com/cluster: upgrade-minor
    postgres-operator.crunchydata.com/role: pgbouncer
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: upgrade-minor
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 2
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
kind: Job
apiVersion: batch/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: upgrade-minor
    postgres-operator.crunchydata.com/pgbackrest: ''
    postgres-operator.crunchydata.com/pgbackrest-backup: replica-create
    postgres-operator.crunchydata.com/pgbackrest-repo: repo1
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      controller: true
      blockOwnerDeletion: true
status:
  succeeded: 1
---
apiVersion: upstream.pgv2.percona.com/v1beta1
kind: PostgresCluster
metadata:
  # 6 = create + 2 manual-backup options writes (steps 02, 07)
  #   + restore spec write and cleanup (step 08) + cluster upgrade (step 09).
  # The operator upgrade in step 04 adds nothing: an unset builtin flag stays
  # unset, so it does not bump the generation.
  generation: 6
  labels:
    e2e: upgrade-minor
  name: upgrade-minor
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: upgrade-minor
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 6
  pgbackrest:
    repoHost:
      apiVersion: apps/v1
      kind: StatefulSet
      ready: true
    repos:
      - bound: true
        name: repo1
        replicaCreateBackupComplete: true
        stanzaCreated: true
      - name: repo2
        stanzaCreated: true
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: upgrade-minor
  # 6 = create + 2 manual-backup options writes (steps 02, 07)
  #   + restore patch (step 08) + the operator resetting restore.enabled
  #   after it finishes + cluster upgrade apply (step 09)
  generation: 6
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
      - name: instance1
        ready: 3
        size: 3
    ready: 3
    size: 3
  state: ready
