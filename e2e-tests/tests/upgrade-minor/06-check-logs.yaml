apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      # no errors "in between": operator + postgres logs since the update
      check_logs_for_errors ${test_name} "$(cat ${TEMP_DIR}/update_ts.txt)" ../../tests/upgrade-minor/conf/log-allowlist.txt
