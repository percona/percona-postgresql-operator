apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      # backups must work while the NEW operator manages a cluster that still
      # carries the RELEASED crVersion — that is the point of this step
      current_cr_ver=$(kubectl -n "${NAMESPACE}" get perconapgcluster ${test_name} -o jsonpath='{.spec.crVersion}')
      released_cr_ver=$(cat ${TEMP_DIR}/cr_ver_released.txt)
      if [[ "$current_cr_ver" != "$released_cr_ver" ]]; then
          echo "ERROR: crVersion changed unexpectedly: $current_cr_ver != $released_cr_ver"
          exit 1
      fi

      kubectl -n "${NAMESPACE}" apply -f - << BACKUP
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      metadata:
        name: backup-old-crversion
      spec:
        pgCluster: ${test_name}
        repoName: repo2
        options:
          - --type=full
      BACKUP
