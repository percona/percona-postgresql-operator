apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 300
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions
      init_temp_dir # do this only in the first TestStep
      destroy_cert_manager 

      git_tag="v$(curl -s https://check.percona.com/versions/v1/pg-operator | jq -r '.versions[].operator' | sort -V | tail -n1)"
      deploy_operator_gh $git_tag
      deploy_client

      # SeaweedFS + pgbackrest credentials for repo2 (cross-version backup/restore)
      kubectl -n "${NAMESPACE}" apply -f "${TESTS_CONFIG_DIR}/minio-secret.yml"
      access_key="$(kubectl -n "${NAMESPACE}" get secret minio-secret \
        -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
      secret_key="$(kubectl -n "${NAMESPACE}" get secret minio-secret \
        -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"

      create_s3_tls_secret
      deploy_s3_storage s3-tls

      cat > "${TEMP_DIR}/pgbackrest-minio.ini" << INI
      [global]
      repo2-s3-key=${access_key}
      repo2-s3-key-secret=${secret_key}
      INI
      kubectl -n "${NAMESPACE}" create secret generic upgrade-minor-pgbackrest-secrets \
        --from-file=cloud.conf="${TEMP_DIR}/pgbackrest-minio.ini"

      kubectl -n "${NAMESPACE}" create configmap upgrade-minor-init-sql \
        --from-literal=init.sql='CREATE SCHEMA IF NOT EXISTS app;'
