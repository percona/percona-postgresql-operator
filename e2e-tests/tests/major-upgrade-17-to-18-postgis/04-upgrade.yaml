apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      add_arch_to_pg_upgrade - <<-EOF | kubectl apply -n ${NAMESPACE} -f -
        apiVersion: pgv2.percona.com/v2
        kind: PerconaPGUpgrade
        metadata:
          name: 17-to-18-postgis
        spec:
          postgresClusterName: major-upgrade-17-to-18-postgis
          image: ${IMAGE_UPGRADE}
          fromPostgresVersion: 17
          toPostgresVersion: 18
          toPostgresImage: $(get_container_image "postgis" 18)
          toPgBouncerImage: $(get_container_image "pgbouncer" 18)
          toPgBackRestImage: $(get_container_image "pgbackrest" 18)
      EOF
