apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      uri="postgres:$(get_psql_user_pass additional-volumes-pguser-postgres)@$(get_psql_user_host additional-volumes-pguser-postgres)"

      run_psql_local \
        "CREATE TABLESPACE myts LOCATION '\''/tablespaces/myts/data'\'';" \
        "${uri}"

      run_psql_local \
        'CREATE DATABASE myapp; \c myapp \\\ CREATE TABLE IF NOT EXISTS myApp (id int PRIMARY KEY) TABLESPACE myts;' \
        "${uri}"

      run_psql_local \
        '\c myapp \\\ INSERT INTO myApp (id) VALUES (100500)' \
        "${uri}"
