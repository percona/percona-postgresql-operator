apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      add_arch_to_pg_upgrade - <<-EOF | kubectl apply -n ${NAMESPACE} -f -
        apiVersion: pgv2.percona.com/v2
        kind: PerconaPGUpgrade
        metadata:
          name: 18-to-19-postgis
        spec:
          postgresClusterName: major-upgrade-18-to-19-postgis
          image: ${IMAGE_UPGRADE}
          fromPostgresVersion: 18
          toPostgresVersion: 19
          toPostgresImage: $(get_container_image "postgis" 19)
          toPgBouncerImage: $(get_container_image "pgbouncer" 19)
          toPgBackRestImage: $(get_container_image "pgbackrest" 19)
      EOF
