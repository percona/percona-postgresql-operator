apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 900
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      verify_certificate_recreation() {
          local cert_name="$1"
          local secret_name
          local cert_before
          local cert_after
          local required_keys="tls.crt tls.key"
          local key
          local escaped_key
          local value

          secret_name=$(kubectl -n "$NAMESPACE" get certificate "$cert_name" -o jsonpath='{.spec.secretName}')
          cert_before=$(kubectl -n "$NAMESPACE" get secret "$secret_name" -o jsonpath='{.data.tls\.crt}')

          kubectl -n "$NAMESPACE" delete certificate "$cert_name" --wait=true --timeout=120s
          kubectl -n "$NAMESPACE" wait --for=delete "secret/${secret_name}" --timeout=120s
          retry 6 5 kubectl -n "$NAMESPACE" get certificate "$cert_name"
          kubectl -n "$NAMESPACE" wait --for=condition=Ready "certificate/${cert_name}" --timeout=120s

          cert_after=$(kubectl -n "$NAMESPACE" get secret "$secret_name" -o jsonpath='{.data.tls\.crt}')
          if [[ "$cert_before" == "$cert_after" ]]; then
              echo "Secret $secret_name data did not change after Certificate $cert_name recreation"
              return 1
          fi

          if [[ "$cert_name" == "cert-manager-tls-pgbouncer-cert" ]]; then
              required_keys="${required_keys} ca.crt"
          fi
          for key in ${required_keys}; do
              escaped_key="${key//./\\.}"
              value=$(kubectl -n "$NAMESPACE" get secret "$secret_name" -o jsonpath="{.data.${escaped_key}}")
              if [[ -z "$value" ]]; then
                  echo "Secret $secret_name is missing key: $key"
                  return 1
              fi
          done

          echo "Certificate $cert_name and Secret $secret_name were recreated"
      }

      verify_certificate_recreation cert-manager-tls-pgbouncer-cert
      verify_certificate_recreation cert-manager-tls-pgbackrest-repo-cert
      verify_certificate_recreation cert-manager-tls-pgbackrest-client-cert

      instance_sts=$(kubectl -n "$NAMESPACE" get sts \
        -l postgres-operator.crunchydata.com/cluster=cert-manager-tls,postgres-operator.crunchydata.com/instance-set=instance1 \
        -o jsonpath='{.items[*].metadata.name}')

      for sts_name in $instance_sts; do
          secret_name="${sts_name}-certs"
          kubectl -n "$NAMESPACE" delete secret "$secret_name"
          echo "Deleted instance secret $secret_name"
      done

      verify_instance_secret_recovered() {
          local secret_name="$1"
          for key in tls.crt tls.key dns.crt dns.key patroni.ca-roots patroni.crt-combined pgbackrest-server.crt pgbackrest-server.key; do
              escaped_key="${key//./\\.}"
              val=$(kubectl -n "$NAMESPACE" get secret "$secret_name" -o jsonpath="{.data.${escaped_key}}" 2>/dev/null)
              if [[ -z "$val" ]]; then
                  echo "Recovered instance secret $secret_name is missing key: $key"
                  return 1
              fi
          done
      }

      for sts_name in $instance_sts; do
          secret_name="${sts_name}-certs"
          retry 30 10 verify_instance_secret_recovered "$secret_name"
          echo "Instance secret $secret_name recovered with all required keys"
      done

      wait_cluster_consistency cert-manager-tls
