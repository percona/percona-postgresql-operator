apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
commands:
  - script: |-
      set -o errexit

      timeout=530
      interval=5
      elapsed=0

      until
        json=$(kubectl get pg standby-cluster -n "${NAMESPACE}" -o json) &&
        state=$(printf '%s' "$json" | jq -r '.status.state // empty') &&
        condStatus=$(printf '%s' "$json" | jq -r '.status.conditions[]? | select(.type == "StandbyLagging") | .status') &&
        condReason=$(printf '%s' "$json" | jq -r '.status.conditions[]? | select(.type == "StandbyLagging") | .reason') &&
        [ "$state" = "ready" ] &&
        [ "$condStatus" = "False" ] &&
        [ "$condReason" = "LagNotDetected" ]
      do
        echo "Waiting lag fix, clusterState=$state, status=$condStatus reason=$condReason"
        sleep "$interval"
      done
