apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 480
commands:
  - script: |
      set -o errexit

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        echo "Skipping TDE assertions for PostgreSQL ${PG_VER}"
        exit 0
      fi

      echo "Waiting for source cluster to be ready"
      kubectl wait --for=jsonpath='{.status.state}'=ready --timeout=480s -n "${NAMESPACE}" pg/source-cluster

      wait_pg_condition "source-cluster" "PGTDEEnabled" "True" "Enabled" "pg_tde is enabled in PerconaPGCluster" "1"
      wait_pg_condition "source-cluster" "PGTDEVaultProviderReady" "True" "Configured" "pg_tde vault key provider matches the spec" "1"

      until assert_tde_state "source-cluster"; do
        echo "Waiting PG TDE expected state in source cluster"
        sleep 5
      done

      echo "PG TDE expected state reached in source cluster"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: source-cluster
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
  - apiVersion: upstream.pgv2.percona.com/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: PostgresCluster
    name: source-cluster
status:
  availableReplicas: 1
  currentReplicas: 1
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: source-cluster-pgbouncer
  labels:
    postgres-operator.crunchydata.com/cluster: source-cluster
    postgres-operator.crunchydata.com/role: pgbouncer
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: source-cluster
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 1
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
apiVersion: upstream.pgv2.percona.com/v1beta1
kind: PostgresCluster
metadata:
  name: source-cluster
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: source-cluster
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 1
  pgbackrest:
    repos:
      - name: repo1
        stanzaCreated: true
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: source-cluster
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready
