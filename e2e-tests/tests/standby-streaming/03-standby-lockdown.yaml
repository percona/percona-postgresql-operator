apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      # This introduces intermittent connectivity and replication lag without completely disconnecting the standby.
      network_delay "${NAMESPACE}" "standby-cluster" "source-cluster-ha"
