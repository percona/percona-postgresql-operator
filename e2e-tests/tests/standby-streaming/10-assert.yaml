apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 480
commands:
  - script: |-
      set -o errexit

      kubectl wait --for=condition=PGTDEEnabled --timeout=480s -n "${NAMESPACE}" pg/standby-cluster
      kubectl wait --for=condition=PGTDEVaultProviderReady --timeout=480s -n "${NAMESPACE}" pg/standby-cluster

      condStatus=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].status}')
      condReason=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].reason}')
      condMsg=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].message}')
      condGen=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].observedGeneration}')
      if [[ "${condStatus}" != "True" ]]; then
        echo "expected PGTDEEnabled status True, got ${condStatus}"
        exit 1
      fi
      if [[ "${condReason}" != "Enabled" ]]; then
        echo "expected PGTDEEnabled reason Enabled, got ${condReason}"
        exit 1
      fi
      if [[ "${condMsg}" != "pg_tde is enabled in PerconaPGCluster" ]]; then
        echo "expected PGTDEEnabled message 'pg_tde is enabled in PerconaPGCluster', got ${condMsg}"
        exit 1
      fi
      if [[ "${condGen}" != "2" ]]; then
        echo "expected PGTDEEnabled observedGeneration 2, got ${condGen}"
        exit 1
      fi

      condStatus=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].status}')
      condReason=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].reason}')
      condMsg=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].message}')
      condGen=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].observedGeneration}')
      if [[ "${condStatus}" != "True" ]]; then
        echo "expected PGTDEVaultProviderReady status True, got ${condStatus}"
        exit 1
      fi
      if [[ "${condReason}" != "Configured" ]]; then
        echo "expected PGTDEVaultProviderReady reason Configured, got ${condReason}"
        exit 1
      fi
      if [[ "${condMsg}" != "pg_tde vault key provider matches the spec" ]]; then
        echo "expected PGTDEVaultProviderReady message 'pg_tde vault key provider matches the spec', got ${condMsg}"
        exit 1
      fi
      if [[ "${condGen}" != "2" ]]; then
        echo "expected PGTDEVaultProviderReady observedGeneration 2, got ${condGen}"
        exit 1
      fi


      # role=primary, spec.standby.enabled=false and status.state=ready are not
      # proof of promotion: a Standby Leader keeps the primary label and can be
      # ready while still in recovery. pg_is_in_recovery() is the Postgres signal.
      primary=$(kubectl -n "${NAMESPACE}" get pods --selector=postgres-operator.crunchydata.com/role=primary,postgres-operator.crunchydata.com/cluster=standby-cluster -o jsonpath='{.items[0].metadata.name}')

      in_recovery=$(kubectl -n "${NAMESPACE}" exec "${primary}" -c database -- psql -t -A -c 'SELECT pg_is_in_recovery();')
      test "${in_recovery}" = "f"

      patroni_list=$(kubectl -n "${NAMESPACE}" exec "${primary}" -c database -- patronictl list)
      if echo "${patroni_list}" | grep -q 'Standby Leader'; then
        echo "Patroni still reports Standby Leader:"
        echo "${patroni_list}"
        exit 1
      fi
      if ! echo "${patroni_list}" | grep -q '| Leader  |'; then
        echo "Patroni does not report a Leader:"
        echo "${patroni_list}"
        exit 1
      fi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
  - apiVersion: postgres-operator.crunchydata.com/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: PostgresCluster
    name: standby-cluster
status:
  availableReplicas: 1
  currentReplicas: 1
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: standby-cluster-pgbouncer
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/role: pgbouncer
  ownerReferences:
    - apiVersion: postgres-operator.crunchydata.com/v1beta1
      kind: PostgresCluster
      name: standby-cluster
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 1
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
kind: Job
apiVersion: batch/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/pgbackrest: ''
    postgres-operator.crunchydata.com/pgbackrest-backup: replica-create
    postgres-operator.crunchydata.com/pgbackrest-repo: repo1
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      controller: true
      blockOwnerDeletion: true
status:
  succeeded: 1
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: standby-cluster
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: standby-cluster
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 2
  pgbackrest:
    repos:
      - name: repo1
        stanzaCreated: true
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: standby-cluster
spec:
  standby:
    enabled: false
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready