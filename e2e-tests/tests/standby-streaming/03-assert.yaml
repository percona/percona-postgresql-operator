apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 480
commands:
  - timeout: 60
    script: |
      set -o errexit

      pgversion=$(kubectl -n ${NAMESPACE} get pg standby-cluster -o jsonpath='{.spec.postgresVersion}')
      # Standby leader is labeled primary but stays in recovery, so restore_command is set.
      standby_leader=$(kubectl -n ${NAMESPACE} get pods --selector=postgres-operator.crunchydata.com/role=primary,postgres-operator.crunchydata.com/cluster=standby-cluster -o jsonpath='{.items[0].metadata.name}')

      if [[ $(kubectl -n ${NAMESPACE} exec ${standby_leader} -c database -- psql -t -A -c 'SHOW pg_tde.wal_encrypt;') != "on" ]]; then
        echo "pg_tde.wal_encrypt is not enabled in ${standby_leader}"
        exit 1
      fi

      for pod in $(kubectl -n ${NAMESPACE} get pods -o name \
        --selector=postgres-operator.crunchydata.com/cluster=standby-cluster,postgres-operator.crunchydata.com/data=postgres); do
        annotation=$(kubectl -n ${NAMESPACE} get ${pod} -o yaml | yq '.metadata.annotations."pgv2.percona.com/tde-wal-encryption"')
        if [[ ${annotation} != "true" ]]; then
          echo "${pod} is not annotated for WAL encryption: ${annotation}"
          exit 1
        fi

        target=$(kubectl -n ${NAMESPACE} exec ${pod} -c database -- readlink /pgdata/pg_tde)
        if [[ ${target} != "/pgdata/pg${pgversion}/pg_tde" ]]; then
          echo "${pod} does not link the pg_tde keyring: ${target}"
          exit 1
        fi
        if ! kubectl -n ${NAMESPACE} exec ${pod} -c database -- test -d /pgdata/pg_tde; then
          echo "${pod} pg_tde keyring link does not resolve"
          exit 1
        fi
      done

      restore_command=$(kubectl -n ${NAMESPACE} exec ${standby_leader} -c database -- psql -t -A -c 'SHOW restore_command;')
      if [[ ${restore_command} != *'pg_tde_restore_encrypt %f %p '* ]]; then
        echo "restore_command doesn't use the pg_tde_restore_encrypt wrapper in ${standby_leader}: ${restore_command}"
        exit 1
      fi

      for key in pgbackrest_instance.conf pgbackrest_repo.conf; do
        conf=$(kubectl get -n ${NAMESPACE} cm standby-cluster-pgbackrest-config -o yaml | yq '.data."'"${key}"'"')
        if ! echo "${conf}" | grep -q '^checksum-page = n$'; then
          echo "no checksum-page in ${key}"
          exit 1
        fi
      done

      instance_conf=$(kubectl get -n ${NAMESPACE} cm standby-cluster-pgbackrest-config -o yaml | yq '.data."pgbackrest_instance.conf"')
      if ! echo "${instance_conf}" | grep -q '^archive-async = n$'; then
        echo "archive-async is not disabled in pgbackrest_instance.conf"
        exit 1
      fi
  - script: |-
      set -o errexit

      kubectl wait --for=condition=PGTDEEnabled --timeout=480s -n "${NAMESPACE}" pg/standby-cluster
      kubectl wait --for=condition=PGTDEVaultProviderReady --timeout=480s -n "${NAMESPACE}" pg/standby-cluster

      condStatus=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].status}')
      condReason=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].reason}')
      condMsg=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].message}')
      condGen=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].observedGeneration}')
      test "$condStatus" = "True"
      test "$condReason" = "ReplicatedFromSource"
      test "$condMsg" = "pg_tde arrived with the data replicated from the source cluster"
      test "$condGen" = "1"

      condStatus=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].status}')
      condReason=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].reason}')
      condMsg=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].message}')
      condGen=$(kubectl get pg -n "${NAMESPACE}" standby-cluster -o jsonpath='{.status.conditions[?(@.type=="PGTDEVaultProviderReady")].observedGeneration}')
      test "$condStatus" = "True"
      test "$condReason" = "ReplicatedFromSource"
      test "$condMsg" = "pg_tde fetched its principal key using the replicated key provider"
      test "$condGen" = "1"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
  - apiVersion: upstream.pgv2.percona.com/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: PostgresCluster
    name: standby-cluster
status:
  availableReplicas: 1
  currentReplicas: 1
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: standby-cluster-pgbouncer
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/role: pgbouncer
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: standby-cluster
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 1
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
apiVersion: upstream.pgv2.percona.com/v1beta1
kind: PostgresCluster
metadata:
  name: standby-cluster
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: standby-cluster
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 1
  pgbackrest:
    repos:
      - name: repo1
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: standby-cluster
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready
