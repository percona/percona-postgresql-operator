apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      uri="postgres:$(get_psql_user_pass custom-extensions-pguser-postgres)@$(get_psql_user_host custom-extensions-pguser-postgres)"

      data=$(kubectl -n ${NAMESPACE} exec $(get_client_pod) -- psql -v ON_ERROR_STOP=1 -t -q postgres://${uri} -c "\c postgres" -c "select name from pg_available_extensions where name in ('pg_cron','pg_stat_monitor','pgaudit') order by name")

      kubectl create configmap -n "${NAMESPACE}" 10-check-extensions --from-literal=data="${data}"

      # the postgres image bundles pg_cron as a builtin extension and its files
      # match the custom archive, so pg_available_extensions cannot show the
      # uninstall - prove it by the installer markers being gone from every pod
      for pod in $(kubectl get pods -n ${NAMESPACE} -l postgres-operator.crunchydata.com/data=postgres -o name); do
          kubectl -n ${NAMESPACE} exec ${pod} -c database -- sh -c "! ls /pgdata/extension/${PG_VER}/*.installed" \
              || { echo "ERROR: custom extension markers still present in ${pod}"; exit 1; }
      done
