apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 30
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      uri="postgres:$(get_psql_user_pass custom-extensions-pguser-postgres)@$(get_psql_user_host custom-extensions-pguser-postgres)"

      data=$(kubectl -n ${NAMESPACE} exec $(get_client_pod) -- psql -v ON_ERROR_STOP=1 -t -q postgres://${uri} -c "\c postgres" -c "select name from pg_available_extensions where name in ('pg_cron','pg_stat_monitor','pgaudit') order by name")

      kubectl create configmap -n "${NAMESPACE}" 16-check-extensions --from-literal=data="${data}"

      # after the update in step 14 the installer must have replaced 1.6.6 with
      # 1.6.7 on every instance pod (default_version stays 1.6 for all pg_cron
      # 1.6.x releases, so only the installer markers can prove the update)
      for pod in $(kubectl get pods -n ${NAMESPACE} -l postgres-operator.crunchydata.com/data=postgres -o name); do
          kubectl -n ${NAMESPACE} exec ${pod} -c database -- test -f /pgdata/extension/${PG_VER}/pg_cron-pg${PG_VER}-1.6.7.installed \
              || { echo "ERROR: custom pg_cron 1.6.7 is not installed in ${pod}"; exit 1; }
          kubectl -n ${NAMESPACE} exec ${pod} -c database -- test ! -f /pgdata/extension/${PG_VER}/pg_cron-pg${PG_VER}-1.6.6.installed \
              || { echo "ERROR: old custom pg_cron 1.6.6 was not uninstalled in ${pod}"; exit 1; }
      done
