apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 480
commands:
  - script: |
      set -o errexit

      condStatus=$(kubectl get pg -n "${NAMESPACE}" start-from-backup-tde -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].status}')
      condReason=$(kubectl get pg -n "${NAMESPACE}" start-from-backup-tde -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].reason}')
      condMsg=$(kubectl get pg -n "${NAMESPACE}" start-from-backup-tde -o jsonpath='{.status.conditions[?(@.type=="PGTDEEnabled")].message}')
      if [[ "${condStatus}" != "True" ]]; then
        echo "expected PGTDEEnabled status True, got ${condStatus}"
        exit 1
      fi
      if [[ "${condReason}" != "Enabled" ]]; then
        echo "expected PGTDEEnabled reason Enabled, got ${condReason}"
        exit 1
      fi
      if [[ "${condMsg}" != "pg_tde is enabled in PerconaPGCluster" ]]; then
        echo "expected PGTDEEnabled message 'pg_tde is enabled in PerconaPGCluster', got ${condMsg}"
        exit 1
      fi
  - timeout: 60
    script: |
      set -o errexit

      cluster=start-from-backup-tde
      pgversion=$(kubectl -n ${NAMESPACE} get pg ${cluster} -o jsonpath='{.spec.postgresVersion}')
      primary=$(kubectl -n ${NAMESPACE} get pods --selector=postgres-operator.crunchydata.com/role=primary,postgres-operator.crunchydata.com/cluster=${cluster} -o jsonpath='{.items[0].metadata.name}')
      replica=$(kubectl -n ${NAMESPACE} get pods --selector=postgres-operator.crunchydata.com/role=replica,postgres-operator.crunchydata.com/cluster=${cluster} -o jsonpath='{.items[0].metadata.name}')

      if [[ $(kubectl -n ${NAMESPACE} exec ${primary} -c database -- psql -t -A -c 'SHOW pg_tde.wal_encrypt;') != "on" ]]; then
        echo "pg_tde.wal_encrypt is not enabled in ${primary}"
        exit 1
      fi

      for pod in $(kubectl -n ${NAMESPACE} get pods -o name \
        --selector=postgres-operator.crunchydata.com/cluster=${cluster},postgres-operator.crunchydata.com/data=postgres); do
        annotation=$(kubectl -n ${NAMESPACE} get ${pod} -o yaml | yq '.metadata.annotations."pgv2.percona.com/tde-wal-encryption"')
        if [[ ${annotation} != "true" ]]; then
          echo "${pod} is not annotated for WAL encryption: ${annotation}"
          exit 1
        fi

        target=$(kubectl -n ${NAMESPACE} exec ${pod} -c database -- readlink /pgdata/pg_tde)
        if [[ ${target} != "/pgdata/pg${pgversion}/pg_tde" ]]; then
          echo "${pod} does not link the pg_tde keyring: ${target}"
          exit 1
        fi
        if ! kubectl -n ${NAMESPACE} exec ${pod} -c database -- test -d /pgdata/pg_tde; then
          echo "${pod} pg_tde keyring link does not resolve"
          exit 1
        fi
      done

      archive_command=$(kubectl -n ${NAMESPACE} exec ${primary} -c database -- psql -t -A -c 'SHOW archive_command;')
      if [[ ${archive_command} != 'pg_tde_archive_decrypt %f %p "pgbackrest --stanza=db archive-push %%p"'* ]]; then
        echo "archive_command doesn't start with the pg_tde_archive_decrypt wrapper in ${primary}: ${archive_command}"
        exit 1
      fi

      if [[ ${archive_command} != *'pg_tde_waldump'* ]]; then
        echo "archive_command doesn't use pg_tde_waldump in ${primary}: ${archive_command}"
        exit 1
      fi

      restore_command=$(kubectl -n ${NAMESPACE} exec ${replica} -c database -- psql -t -A -c 'SHOW restore_command;')
      if [[ ${restore_command} != *'pg_tde_restore_encrypt %f %p '* ]]; then
        echo "restore_command doesn't use the pg_tde_restore_encrypt wrapper in ${replica}: ${restore_command}"
        exit 1
      fi

      for key in pgbackrest_instance.conf pgbackrest_repo.conf; do
        conf=$(kubectl get -n ${NAMESPACE} cm ${cluster}-pgbackrest-config -o yaml | yq '.data."'"${key}"'"')
        if ! echo "${conf}" | grep -q '^checksum-page = n$'; then
          echo "no checksum-page in ${key}"
          exit 1
        fi
      done

      instance_conf=$(kubectl get -n ${NAMESPACE} cm ${cluster}-pgbackrest-config -o yaml | yq '.data."pgbackrest_instance.conf"')
      if ! echo "${instance_conf}" | grep -q '^archive-async = n$'; then
        echo "archive-async is not disabled in pgbackrest_instance.conf"
        exit 1
      fi
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: start-from-backup-tde
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
    - apiVersion: postgres-operator.crunchydata.com/v1beta1
      kind: PostgresCluster
      name: start-from-backup-tde
      controller: true
      blockOwnerDeletion: true
spec:
  template:
    metadata:
      annotations:
        pgv2.percona.com/tde-installed: "true"
        pgv2.percona.com/tde-wal-encryption: "true"
status:
  observedGeneration: 1
  replicas: 1
  readyReplicas: 1
  currentReplicas: 1
  updatedReplicas: 1
  collisionCount: 0
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: start-from-backup-tde-pgbouncer
  labels:
    postgres-operator.crunchydata.com/cluster: start-from-backup-tde
    postgres-operator.crunchydata.com/role: pgbouncer
  annotations:
    deployment.kubernetes.io/revision: '1'
  ownerReferences:
    - apiVersion: postgres-operator.crunchydata.com/v1beta1
      kind: PostgresCluster
      name: start-from-backup-tde
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 1
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
kind: Job
apiVersion: batch/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: start-from-backup-tde
    postgres-operator.crunchydata.com/pgbackrest: ''
    postgres-operator.crunchydata.com/pgbackrest-backup: replica-create
    postgres-operator.crunchydata.com/pgbackrest-repo: repo1
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      controller: true
      blockOwnerDeletion: true
status:
  succeeded: 1
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: start-from-backup-tde
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: start-from-backup-tde
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 1
  pgbackrest:
    repos:
      - name: repo1
        stanzaCreated: true
    restore:
      finished: true
      id: ~pgo-bootstrap-start-from-backup-tde
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: start-from-backup-tde
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: start-from-backup-tde-bootstrap
spec:
  pgCluster: start-from-backup-tde
  repoName: repo1
status:
  state: Succeeded
