apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 480
commands:
  - script: |
      tmp_file=$(mktemp)
      kubectl -n $NAMESPACE get pg start-from-backup-tde -o yaml | yq '.status.conditions.[] | select(.type == "PGTDEEnabled")' > ${tmp_file}
      [[ $(cat ${tmp_file} | yq .message) == "pg_tde is enabled in PerconaPGCluster" ]]
      [[ $(cat ${tmp_file} | yq .reason) == "Enabled" ]]
      [[ $(cat ${tmp_file} | yq .status) == "True" ]]
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: start-from-backup-tde
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: start-from-backup-tde
      controller: true
      blockOwnerDeletion: true
spec:
  template:
    metadata:
      annotations:
        pgv2.percona.com/tde-installed: "true"
status:
  observedGeneration: 1
  replicas: 1
  readyReplicas: 1
  currentReplicas: 1
  updatedReplicas: 1
  collisionCount: 0
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: start-from-backup-tde-pgbouncer
  labels:
    postgres-operator.crunchydata.com/cluster: start-from-backup-tde
    postgres-operator.crunchydata.com/role: pgbouncer
  annotations:
    deployment.kubernetes.io/revision: '1'
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: start-from-backup-tde
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 1
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
kind: Job
apiVersion: batch/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: start-from-backup-tde
    postgres-operator.crunchydata.com/pgbackrest: ''
    postgres-operator.crunchydata.com/pgbackrest-backup: replica-create
    postgres-operator.crunchydata.com/pgbackrest-repo: repo1
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      controller: true
      blockOwnerDeletion: true
status:
  succeeded: 1
---
apiVersion: upstream.pgv2.percona.com/v1beta1
kind: PostgresCluster
metadata:
  name: start-from-backup-tde
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: start-from-backup-tde
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 1
  pgbackrest:
    repos:
      - name: repo1
        stanzaCreated: true
    restore:
      finished: true
      id: ~pgo-bootstrap-start-from-backup-tde
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: start-from-backup-tde
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: start-from-backup-tde-bootstrap
spec:
  pgCluster: start-from-backup-tde
  repoName: repo1
status:
  state: Succeeded
