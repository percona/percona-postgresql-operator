apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pg_image="${IMAGE_POSTGRESQL15:-$(get_container_image "postgres" 15)}"
      pgbouncer_image="${IMAGE_PGBOUNCER15:-$(get_container_image "pgbouncer" 15)}"
      pgbackrest_image="${IMAGE_BACKREST15:-$(get_container_image "pgbackrest" 15)}"

      kubectl apply -n ${NAMESPACE} -f - <<-EOF
        apiVersion: pgv2.percona.com/v2
        kind: PerconaPGUpgrade
        metadata:
          name: 14-to-15
        spec:
          postgresClusterName: major-upgrade-14-to-15
          image: ${IMAGE_UPGRADE}
          fromPostgresVersion: 14
          toPostgresVersion: 15
          toPostgresImage: ${pg_image}
          toPgBouncerImage: ${pgbouncer_image}
          toPgBackRestImage: ${pgbackrest_image}
      EOF
