apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
commands:
  - script: |
      set +o xtrace

      for secret in \
        init-deploy-replication-cert \
        init-deploy-cluster-cert \
        init-deploy-cluster-ca-cert; do
        until kubectl get secret "${secret}" -n "${NAMESPACE}" -o json 2>/dev/null \
          | jq -e '
              if any(.metadata.ownerReferences[]?; .kind == "PostgresCluster") then
                .metadata.annotations["test-annotation"] == "test" and
                .metadata.labels["test-label"] == "test"
              else
                true
              end
            ' >/dev/null; do
          sleep 5
        done
      done
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    test-annotation: test
  labels:
    app.kubernetes.io/instance: init-deploy
    app.kubernetes.io/managed-by: percona-postgresql-operator
    app.kubernetes.io/name: percona-postgresql
    app.kubernetes.io/part-of: percona-postgresql
    pgv2.percona.com/version: 3.1.0
    postgres-operator.crunchydata.com/cluster: init-deploy
    postgres-operator.crunchydata.com/pgbackrest: ""
    postgres-operator.crunchydata.com/pgbackrest-config: ""
    test-label: test
  name: init-deploy-pgbackrest
type: Opaque
---
