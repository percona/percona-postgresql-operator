apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        exit 0
      fi

      # Taken while both replicas are running, so the restore below brings the
      # publications back with it while the replication slots stay gone:
      # pgBackRest does not back up pg_replslot.
      cat <<EOF | kubectl -n "${NAMESPACE}" apply -f -
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      metadata:
        name: logical-replica-full-repo1
      spec:
        pgCluster: logical-replica
        repoName: repo1
        options:
        - --type=full
      EOF
