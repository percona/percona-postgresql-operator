apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 600
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        exit 0
      fi

      PASS=$(get_psql_user_pass logical-replica-pguser-postgres)
      HOST=$(get_psql_user_host logical-replica-pguser-postgres)

      replica_row_count() {
        local replica=$1
        local want=$2
        local got

        got=$(run_psql \
          '\c logical-replica \\\ SELECT count(*) FROM lr_test;' \
          "postgres://postgres:${PASS}@logical-replica-lr-${replica}.${NAMESPACE}.svc" | xargs)

        echo "rows on ${replica}: ${got} (want ${want})"
        [[ ${got} == "${want}" ]]
      }

      # Written after the backup, so the restore rolls it back. This is the row
      # that tells a genuinely re-seeded replica apart from one that merely
      # resumed: only a resumed one would still be holding it at the end.
      run_psql \
        '\c logical-replica \\\ INSERT INTO lr_test (id) VALUES (3);' \
        "postgres://postgres:${PASS}@${HOST}"

      retry 30 5 replica_row_count analytics 3
      retry 30 5 replica_row_count reporting 3
