apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 480
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        exit 0
      fi

      primary=$(get_pod_by_role logical-replica primary name)
      latest_full_backup=$(kubectl -n "${NAMESPACE}" exec "${primary}" -- \
        pgbackrest info --output json --log-level-console=info |
        jq '[.[] | .backup[] | select(.type == "full") | select(.database.["repo-key"] == 1)][-1].label')

      cat <<EOF | kubectl -n "${NAMESPACE}" apply -f -
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGRestore
      metadata:
        name: logical-replica-restore-repo1
      spec:
        pgCluster: logical-replica
        repoName: repo1
        options:
        - --set=${latest_full_backup}
        - --type=immediate
      EOF

      stopped() {
        local replica=$1
        local got

        got=$(kubectl -n "${NAMESPACE}" get statefulset "logical-replica-lr-${replica}" \
          -o jsonpath='{.spec.replicas}')

        echo "${replica} statefulset replicas: ${got}"
        [[ ${got} == "0" ]]
      }

      retry 30 5 stopped analytics
      retry 30 5 stopped reporting
