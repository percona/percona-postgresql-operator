apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 660
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        exit 0
      fi

      kubectl -n "${NAMESPACE}" wait --for=jsonpath='{.status.state}'=Succeeded \
        --timeout=560s pg-backup/logical-replica-full-repo1
