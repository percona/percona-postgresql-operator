apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      data=$(run_psql_local '\c myapp \\\ SELECT * from myApp;' \
        "postgres:$(get_psql_user_pass wal-volume-pguser-postgres)@$(get_psql_user_host wal-volume-pguser-postgres)")
      kubectl create configmap -n "${NAMESPACE}" 04-read-from-primary --from-literal=data="${data}"

      # Postgres must be writing its WAL segments onto the volume, not the data volume.
      primary=$(get_pod_by_role wal-volume primary name)
      kubectl -n "${NAMESPACE}" exec "${primary}" -c database -- \
        bash -c "ls /pgwal/pg${PG_VER}_wal | grep -qE '^[0-9A-F]{24}$'"
