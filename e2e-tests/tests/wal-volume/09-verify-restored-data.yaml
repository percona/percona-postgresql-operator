apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      data=$(run_psql_local '\c myapp \\\ SELECT * from myApp;' \
        "postgres:$(get_psql_user_pass wal-volume-pguser-postgres)@$(get_psql_user_host wal-volume-pguser-postgres)")
      kubectl create configmap -n "${NAMESPACE}" 09-verify-restored-data --from-literal=data="${data}"

      # The restore rebuilds the data directory; the WAL relocation must be back in place.
      for pod in $(get_instance_set_pods instance1); do
        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink "/pgdata/pg${PG_VER}/pg_wal")
        if [[ ${target} != "/pgwal/pg${PG_VER}_wal" ]]; then
          echo "${pod}: pg_wal points at '${target}' after restore, want '/pgwal/pg${PG_VER}_wal'"
          exit 1
        fi
      done
