apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pvcs=$(kubectl -n "${NAMESPACE}" get pvc \
        --selector postgres-operator.crunchydata.com/role=pgwal \
        -o custom-columns='NAME:.metadata.name' --no-headers)
      if [[ -z ${pvcs} ]]; then
        echo "no WAL PVC was created"
        exit 1
      fi
      for pvc in ${pvcs}; do
        kubectl -n "${NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Bound \
          "pvc/${pvc}" --timeout=120s
      done

      sts=$(kubectl -n "${NAMESPACE}" get sts \
        --selector postgres-operator.crunchydata.com/instance-set=instance1 -o json)

      printf '%s\n' "${sts}" | jq -e '.items[0].spec.template.spec.volumes[]
        | select(.name == "postgres-wal") | select(.persistentVolumeClaim != null)' >/dev/null
      printf '%s\n' "${sts}" | jq -e '.items[0].spec.template.spec.containers[]
        | select(.name == "database") | .volumeMounts[]
        | select(.mountPath == "/pgwal")' >/dev/null
      printf '%s\n' "${sts}" | jq -e '.items[0].spec.template.spec.initContainers[]
        | select(.name == "postgres-startup") | .volumeMounts[]
        | select(.mountPath == "/pgwal")' >/dev/null

      # The startup command relocates the WAL directory and the pgBackRest spool
      # path onto the WAL volume; both are symlinks from the data volume.
      for pod in $(get_instance_set_pods instance1); do
        # /proc/mounts guards against a false positive where the mount silently
        # failed and reads/writes land on the container's own filesystem instead.
        kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          grep -q ' /pgwal ' /proc/mounts

        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink "/pgdata/pg${PG_VER}/pg_wal")
        if [[ ${target} != "/pgwal/pg${PG_VER}_wal" ]]; then
          echo "${pod}: pg_wal points at '${target}', want '/pgwal/pg${PG_VER}_wal'"
          exit 1
        fi

        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink /pgdata/pgbackrest-spool)
        if [[ ${target} != "/pgwal/pgbackrest-spool" ]]; then
          echo "${pod}: pgbackrest-spool points at '${target}', want '/pgwal/pgbackrest-spool'"
          exit 1
        fi
      done
