apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 420
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      # Surviving a pod restart is the definitive proof the WAL lives on the PVC
      # and not on the pod's ephemeral filesystem.
      restart_pg_pods wal-volume instance1
      wait_cluster_consistency wal-volume

      for pod in $(get_instance_set_pods instance1); do
        kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          grep -q ' /pgwal ' /proc/mounts

        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink "/pgdata/pg${PG_VER}/pg_wal")
        if [[ ${target} != "/pgwal/pg${PG_VER}_wal" ]]; then
          echo "${pod}: pg_wal points at '${target}' after restart, want '/pgwal/pg${PG_VER}_wal'"
          exit 1
        fi
      done

      data=$(run_psql_local '\c myapp \\\ SELECT * from myApp;' \
        "postgres:$(get_psql_user_pass wal-volume-pguser-postgres)@$(get_psql_user_host wal-volume-pguser-postgres)")
      kubectl create configmap -n "${NAMESPACE}" 06-read-after-restart --from-literal=data="${data}"
