apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 180
---
apiVersion: upstream.pgv2.percona.com/v1beta1
kind: PostgresCluster
metadata:
  name: wal-volume
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: wal-volume
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  pgbackrest:
    repos:
      - name: repo1
        replicaCreateBackupComplete: true
        stanzaCreated: true
    restore:
      finished: true
      id: wal-volume-restore
      succeeded: 1
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: wal-volume-restore
spec:
  pgCluster: wal-volume
  repoName: repo1
status:
  state: Succeeded
