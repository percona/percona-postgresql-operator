apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions
      init_temp_dir

      CRUNCHY_NS="${NAMESPACE}-crunchy"

      kubectl create namespace "${CRUNCHY_NS}" || true

      pgo_helm_args=()
      helm_arch_args pgo_helm_args
      helm install pgo \
        oci://registry.developers.crunchydata.com/crunchydata/pgo \
        --namespace "${CRUNCHY_NS}" \
        --version "${CPGO_VERSION}" \
        --set singleNamespace=true \
        "${pgo_helm_args[@]}" \
        --wait

      # SeaweedFS with TLS — pgBackRest requires HTTPS; repo1-s3-verify-tls=n skips validation.
      kubectl -n "${NAMESPACE}" apply -f "${TESTS_CONFIG_DIR}/s3-secret.yml"

      access_key="$(kubectl -n "${NAMESPACE}" get secret s3-secret \
        -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
      secret_key="$(kubectl -n "${NAMESPACE}" get secret s3-secret \
        -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"

      create_s3_tls_secret
      deploy_s3_storage s3-tls

      cat > "${TEMP_DIR}/pgbackrest-s3.ini" << EOF
      [global]
      repo1-s3-key=${access_key}
      repo1-s3-key-secret=${secret_key}
      EOF

      kubectl -n "${NAMESPACE}" create secret generic "migration-backup-restore-pgbackrest-secrets" \
        --from-file=cloud.conf="${TEMP_DIR}/pgbackrest-s3.ini"

      kubectl -n "${CRUNCHY_NS}" create secret generic "crunchy-pgbackrest-secret" \
        --from-file=cloud.conf="${TEMP_DIR}/pgbackrest-s3.ini"

      deploy_operator
      deploy_client
    timeout: 300
