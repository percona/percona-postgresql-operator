apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      kubectl -n "${NAMESPACE}" patch pg major-upgrade-logical-replica --type=merge --patch '{
        "spec": {
          "logicalReplicas": [
            {
              "name": "analytics",
              "databases": ["myapp"],
              "bootstrapMethod": "pgbackrest",
              "dataVolumeClaimSpec": {
                "accessModes": ["ReadWriteOnce"],
                "resources": {"requests": {"storage": "1Gi"}}
              }
            }
          ]
        }
      }'
