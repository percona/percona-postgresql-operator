apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      merge_patch_pg major-upgrade-logical-replica <<EOF
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      spec:
        logicalReplicas:
        - name: analytics
          databases: ["myapp"]
          bootstrapMethod: pgbackrest
          dataVolumeClaimSpec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
      EOF
