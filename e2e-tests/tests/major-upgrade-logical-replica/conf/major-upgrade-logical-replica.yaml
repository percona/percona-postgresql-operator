apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
spec:
  instances:
  - name: instance1
    replicas: 2
    dataVolumeClaimSpec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
  # The pgBackRest repository is what the pgbackrest bootstrap method seeds a
  # logical replica from, so this test keeps it.
  proxy:
    pgBouncer:
      replicas: 1
