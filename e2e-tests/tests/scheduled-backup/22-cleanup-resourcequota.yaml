apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      # Remove the ResourceQuota to allow jobs to be created again
      kubectl delete resourcequota no-jobs-quota -n "${NAMESPACE}"
      
      # Disable the schedule to prevent further backup attempts during cleanup
      kubectl patch postgrescluster scheduled-backup -n "${NAMESPACE}" --type=merge -p '
      {
        "spec": {
          "backups": {
            "pgbackrest": {
              "schedules": {
                "repo1": null
              }
            }
          }
        }
      }' 2>/dev/null || true
