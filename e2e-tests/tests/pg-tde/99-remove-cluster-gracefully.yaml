apiVersion: kuttl.dev/v1beta1
kind: TestStep
delete:
- apiVersion: pgv2.percona.com/v2
  kind: PerconaPGCluster
  metadata:
    name: pg-tde
- apiVersion: upstream.pgv2.percona.com/v1beta1
  kind: PostgresCluster
  metadata:
    name: pg-tde
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      vault_name=vault-service

      helm uninstall "${vault_name}" --namespace "${vault_name}" --ignore-not-found || true
      kubectl delete namespace "${vault_name}" --ignore-not-found || true
      kubectl delete csr "vault-csr-${vault_name}" --ignore-not-found || true

      remove_all_finalizers
      check_operator_panic
      destroy_operator
    timeout: 120
