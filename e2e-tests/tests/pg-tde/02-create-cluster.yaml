apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      get_cr \
        | yq '.spec.extensions.pg_tde.enabled = true' \
        | yq '.spec.extensions.pg_tde.vault.host = "https://vault-service.vault.svc:8200"' \
        | yq '.spec.extensions.pg_tde.vault.mountPath = "tde"' \
        | yq '.spec.extensions.pg_tde.vault.tokenSecret.name = "vault-secret"' \
        | yq '.spec.extensions.pg_tde.vault.tokenSecret.key = "token"' \
        | yq '.spec.extensions.pg_tde.vault.caSecret.name = "vault-secret"' \
        | yq '.spec.extensions.pg_tde.vault.caSecret.key = "ca.crt"' \
        | yq '.spec.backups.pgbackrest.global."repo1-cipher-pass" = "JemA6x5xhHA677oKCUSuIiSRMsr3OowgsaCQJu5XuSn/wyOhf48o2QdS9wUwFwOG"' \
        | yq '.spec.backups.pgbackrest.global."repo1-cipher-type" = "aes-256-cbc"' \
        | kubectl -n "${NAMESPACE}" apply -f -
