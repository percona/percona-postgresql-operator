apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 60
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      run_psql_local \
        '\c myapp \\\ INSERT INTO myTable (id) VALUES (100501)' \
        "$(get_psql_uri pg-tde-wal-encrypt postgres)"
      
      sleep 5
