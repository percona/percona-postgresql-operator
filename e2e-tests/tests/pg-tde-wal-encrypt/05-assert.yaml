apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 30
collectors:
  - type: command
    command: bash -c "source ../../functions && collect_pg_logs"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-verify-extension
data:
  pg_tde_extension: ' pg_tde'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-verify-encryption
data:
  pg_tde_is_encrypted: ' t'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: 05-verify-wal-encryption
data:
  pg_tde_wal_encrypt: ' on'
