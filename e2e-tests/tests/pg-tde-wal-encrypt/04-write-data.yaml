apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 180
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      collect_pg_logs_on_failure

      # K8SPG-911: drop the marker archive_command writes, so that the check in step 05
      # can only pass if pg_tde_waldump read one of the encrypted segments archived below.
      primary=$(get_pod_by_role pg-tde-wal-encrypt primary name)
      kubectl -n "${NAMESPACE}" exec "${primary}" -- rm -f /pgdata/latest_commit_timestamp.txt

      run_psql_local \
        'CREATE DATABASE myapp; \c myapp \\\ CREATE TABLE myTable (id int PRIMARY KEY) USING tde_heap;' \
        "$(get_psql_uri pg-tde-wal-encrypt postgres)"

      run_psql_local \
        '\c myapp \\\ INSERT INTO myTable (id) VALUES (100500)' \
        "$(get_psql_uri pg-tde-wal-encrypt postgres)"

      run_psql_command \
        "CHECKPOINT;" \
        "$(get_psql_uri pg-tde-wal-encrypt postgres)"

      run_psql_command \
        "SELECT pg_switch_wal();" \
        "$(get_psql_uri pg-tde-wal-encrypt postgres)"

      archive_timeout=$(run_psql_command \
        "SELECT setting FROM pg_settings WHERE name = 'archive_timeout';" \
        "$(get_psql_uri pg-tde-wal-encrypt postgres)" | xargs)
      sleep "${archive_timeout}"
