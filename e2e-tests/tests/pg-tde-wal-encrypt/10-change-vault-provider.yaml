apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 120
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      new_token=$(kms_cli openbao openbao-service "$(kms_token vault-secret)" token create -format=json \
        | jq -r '.auth.client_token')

      kubectl -n "${NAMESPACE}" get secret vault-secret -o jsonpath='{.data.ca\.crt}' \
        | base64 -d > ${TEMP_DIR}/ca.crt

      kubectl -n "${NAMESPACE}" create secret generic vault-secret-rotated \
        --from-literal=token=${new_token} \
        --from-file=ca.crt=${TEMP_DIR}/ca.crt

      get_cr \
        | yq '.spec.extensions.pg_tde.enabled = true' \
        | yq '.spec.extensions.pg_tde.vault.host = "https://openbao-service.openbao.svc:8200"' \
        | yq '.spec.extensions.pg_tde.vault.mountPath = "tde"' \
        | yq '.spec.extensions.pg_tde.vault.tokenSecret.name = "vault-secret-rotated"' \
        | yq '.spec.extensions.pg_tde.vault.tokenSecret.key = "token"' \
        | yq '.spec.extensions.pg_tde.vault.caSecret.name = "vault-secret-rotated"' \
        | yq '.spec.extensions.pg_tde.vault.caSecret.key = "ca.crt"' \
        | yq '.spec.extensions.pg_tde.walEncryption = true' \
        | add_arch_to_pg - \
        | kubectl -n "${NAMESPACE}" apply -f -
