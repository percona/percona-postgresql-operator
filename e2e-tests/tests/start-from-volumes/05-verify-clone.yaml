apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 30
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      CLONE=start-from-volumes-clone
      if kubectl -n "${NAMESPACE}" get perconapgrestore "${CLONE}-bootstrap" >/dev/null 2>&1; then
        echo "${CLONE}-bootstrap must not exist for volumes dataSource" >&2
        exit 1
      fi

      data=$(run_psql_local '\c myapp \\\ SELECT * from myApp;' \
        "postgres:$(get_psql_user_pass ${CLONE}-pguser-postgres)@$(get_psql_user_host ${CLONE}-pguser-postgres)")

      kubectl create configmap -n "${NAMESPACE}" 05-read-from-clone --from-literal=data="${data}"
