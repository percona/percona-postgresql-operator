apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 30
commands:
  - script: |-
      set -o errexit
      set -o pipefail
      set -o xtrace

      source ../../functions

      # Create a new cluster WITHOUT logcollector.enabled set (field removed).
      # For new clusters the operator should default it to enabled.
      get_cr \
        | yq eval 'del(.spec.logcollector.enabled)' - \
        | kubectl -n "${NAMESPACE}" apply -f -

