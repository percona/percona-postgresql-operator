apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 10
commands:
    - script: |-
          set -o errexit
          set -o xtrace
          
          source ../../functions
          init_temp_dir # do this only in the first TestStep
          
          deploy_operator
          deploy_client

          kubectl -n "${NAMESPACE}" apply -f "${TESTS_CONFIG_DIR}/minio-secret.yml"

          # Self-signed cert whose SAN matches the SeaweedFS Service fluent-bit dials.
          create_s3_tls_secret
          deploy_s3_storage s3-tls
      
