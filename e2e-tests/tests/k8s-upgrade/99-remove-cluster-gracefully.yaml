apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 1000
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      case "${K8S_UPGRADE_PLATFORM}:${PLATFORM}" in
        gke:gke|doks:doks) ;;
        *)
          echo "Unsupported platform combination: K8S_UPGRADE_PLATFORM=${K8S_UPGRADE_PLATFORM}, PLATFORM=${PLATFORM}"
          exit 0
          ;;
      esac

      kubectl delete pg --all
      remove_all_finalizers
      check_operator_panic
      destroy_operator
      cluster_name="$(kubectl get configmap cluster-name -n ${NAMESPACE} -o jsonpath='{.data.name}')"
      delete_k8s_cluster $cluster_name "${K8S_UPGRADE_PLATFORM}" "${K8S_UPGRADE_REGION}"
