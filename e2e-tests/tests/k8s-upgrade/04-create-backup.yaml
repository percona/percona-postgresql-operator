apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 30
    script: |
      set -o errexit
      set -o xtrace

      source ../../functions

      case "${K8S_UPGRADE_PLATFORM}:${PLATFORM}" in
        gke:gke|doks:doks) ;;
        *)
          echo "Unsupported platform combination: K8S_UPGRADE_PLATFORM=${K8S_UPGRADE_PLATFORM}, PLATFORM=${PLATFORM}"
          exit 0
          ;;
      esac

      kubectl apply -n ${NAMESPACE} -f - <<EOF
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      metadata:
        name: k8s-upgrade-full-repo1
      spec:
        pgCluster: k8s-upgrade
        repoName: repo1
        options:
          - --type=full
      EOF
