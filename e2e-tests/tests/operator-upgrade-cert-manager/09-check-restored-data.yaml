apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      # data check for step 08: runs here because kuttl executes TestAssert
      # commands from the harness cwd, not the test dir (08-assert.yaml only
      # waits for the restore to reach Succeeded). The 100501 marker written
      # after the last backup must be gone.
      # The "new cluster with cert-manager gets stable TLS" positive case is
      # covered by the cert-manager-tls suite and is intentionally not
      # duplicated here.
      uri="postgres:$(get_psql_user_pass ${test_name}-pguser-postgres)@$(get_psql_user_host ${test_name}-pguser-postgres)"
      data=$(run_psql_local '\c myapp \\\ SELECT id from myApp ORDER BY id' "$uri" | tr -d '[:space:]')
      if [[ "$data" != "100500" ]]; then
          echo "ERROR: unexpected data after restore: '$data' (want only 100500)"
          exit 1
      fi
