apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      uri="postgres:$(get_psql_user_pass ${test_name}-pguser-postgres)@$(get_psql_user_host ${test_name}-pguser-postgres)"
      # written AFTER backup-after-update — must disappear on restore
      run_psql_local '\c myapp \\\ INSERT INTO myApp VALUES (100501) ON CONFLICT DO NOTHING' "$uri"

      # restore to the END OF THE BACKUP (--type=immediate), not to latest:
      # a default restore replays all archived WAL and the marker would survive
      primary=$(get_pod_by_role ${test_name} primary name)
      latest_full_repo2_backup=$(kubectl -n ${NAMESPACE} exec ${primary} -- \
        pgbackrest info --output json --log-level-console=info \
        | jq '[.[] | .backup[] | select(.type == "full") | select(.database.["repo-key"] == 2)][-1].label')

      kubectl -n "${NAMESPACE}" apply -f - << RESTORE
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGRestore
      metadata:
        name: restore-after-update
      spec:
        pgCluster: ${test_name}
        repoName: repo2
        options:
        - --set=${latest_full_repo2_backup}
        - --type=immediate
      RESTORE
