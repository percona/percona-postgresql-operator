apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGRestore
metadata:
  name: restore-after-update
status:
  state: Succeeded
---
# the cluster must be back to ready after the restore — step 09 connects
# to the primary right away, so restore completion alone is not enough
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: operator-upgrade-cert-manager
status:
  state: ready
  postgres:
    ready: 3
    size: 3
  pgbouncer:
    ready: 3
    size: 3
