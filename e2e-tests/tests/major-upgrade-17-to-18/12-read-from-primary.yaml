apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions
      data=$(run_psql_local '\c myapp \\\ SELECT * from myApp;' "postgres:$(get_psql_user_pass major-upgrade-17-to-18-pguser-postgres)@$(get_psql_user_host major-upgrade-17-to-18-pguser-postgres)")

      kubectl create configmap -n "${NAMESPACE}" 12-read-from-primary --from-literal=data="${data}"

      # K8SPG-911: the restore Job renames the data directory on its way out and Patroni
      # moves it back, so check the keyring link still resolves afterwards.
      pgversion=$(kubectl -n "${NAMESPACE}" get pg major-upgrade-17-to-18 -o jsonpath='{.spec.postgresVersion}')
      for pod in $(kubectl -n "${NAMESPACE}" get pods -o name \
        --selector=postgres-operator.crunchydata.com/cluster=major-upgrade-17-to-18,postgres-operator.crunchydata.com/data=postgres); do
        target=$(kubectl -n "${NAMESPACE}" exec ${pod} -c database -- readlink /pgdata/pg_tde)
        if [[ ${target} != "/pgdata/pg${pgversion}/pg_tde" ]]; then
          echo "${pod} does not link the pg_tde keyring after the restore: ${target}"
          exit 1
        fi
        kubectl -n "${NAMESPACE}" exec ${pod} -c database -- test -d /pgdata/pg_tde
      done
