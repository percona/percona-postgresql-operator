apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name="${test_name}"

      # Delete and recreate to test the race multiple times
      # The bug reproduces more than 50% of the time per the report
      echo "=== Deleting cluster to test race condition again ==="
      kubectl -n "${NAMESPACE}" delete perconapgcluster "${cluster_name}" --wait=true

      # Wait for all pods to be gone
      kubectl -n "${NAMESPACE}" wait --for=delete pods \
        -l "postgres-operator.crunchydata.com/cluster=${cluster_name}" \
        --timeout=60s 2>/dev/null || true

      # Delete PVCs to ensure fresh start
      kubectl -n "${NAMESPACE}" delete pvc \
        -l "postgres-operator.crunchydata.com/cluster=${cluster_name}" \
        --wait=true 2>/dev/null || true

      sleep 5

      echo "=== Recreating cluster (attempt 2) ==="
      get_cr \
        | yq eval '
            .spec.instances = [
              {
                "name": "i1",
                "replicas": 1,
                "dataVolumeClaimSpec": {
                  "accessModes": ["ReadWriteOnce"],
                  "resources": {"requests": {"storage": "1Gi"}}
                }
              },
              {
                "name": "i2",
                "replicas": 1,
                "dataVolumeClaimSpec": {
                  "accessModes": ["ReadWriteOnce"],
                  "resources": {"requests": {"storage": "1Gi"}}
                }
              }
            ] |
            .spec.proxy.pgBouncer.replicas = 1 |
            .spec.patroni.createReplicaMethods = ["pgbackrest", "basebackup"]
          ' - \
        | kubectl -n "${NAMESPACE}" apply -f -

