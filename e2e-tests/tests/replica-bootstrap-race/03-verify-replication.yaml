apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      cluster_name="${test_name}"

      echo "=== Verifying replication is working ==="

      # Find the primary pod
      primary_pod=$(get_pod_by_role "${cluster_name}" primary name)

      if [[ -z "$primary_pod" ]]; then
        echo "ERROR: No primary pod found"
        kubectl -n "${NAMESPACE}" get pods -l "postgres-operator.crunchydata.com/cluster=${cluster_name}" -o wide
        exit 1
      fi

      echo "Primary pod: $primary_pod"

      # Check that _crunchyrepl role exists on primary
      role_exists=$(kubectl -n "${NAMESPACE}" exec "$primary_pod" -c database -- \
        psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='_crunchyrepl'" 2>/dev/null || echo "")

      if [[ "$role_exists" == "1" ]]; then
        echo "✅ _crunchyrepl role exists on primary"
      else
        echo "❌ _crunchyrepl role does NOT exist on primary!"
        echo "   This should never happen after successful bootstrap"
        exit 1
      fi

      # Check replication status
      echo ""
      echo "=== Replication status ==="
      kubectl -n "${NAMESPACE}" exec "$primary_pod" -c database -- \
        psql -U postgres -c "SELECT client_addr, state, sent_lsn, write_lsn, flush_lsn, replay_lsn FROM pg_stat_replication;" 2>/dev/null || true

      # Check Patroni cluster status
      echo ""
      echo "=== Patroni cluster members ==="
      kubectl -n "${NAMESPACE}" exec "$primary_pod" -c database -- \
        patronictl list 2>/dev/null || true


