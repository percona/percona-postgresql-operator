apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 360
commands:
  - script: |-
      set -o errexit

      CRUNCHY_NS="${NAMESPACE}-crunchy"

      for attempt in $(seq 1 30); do
        if [ -n "$(kubectl get job \
          -l postgres-operator.crunchydata.com/pgbackrest-backup=manual,postgres-operator.crunchydata.com/cluster=crunchy-source \
          -n "${CRUNCHY_NS}" \
          -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)" ]; then
          break
        fi
        if [ "${attempt}" -eq 30 ]; then
          echo "Timed out waiting for manual backup job to be created"
          exit 1
        fi
        sleep 5
      done

      kubectl wait job \
        -l postgres-operator.crunchydata.com/pgbackrest-backup=manual,postgres-operator.crunchydata.com/cluster=crunchy-source \
        -n "${CRUNCHY_NS}" \
        --for=condition=Complete \
        --timeout=270s
