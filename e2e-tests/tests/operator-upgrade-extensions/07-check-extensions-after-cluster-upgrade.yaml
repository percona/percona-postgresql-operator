apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 300
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      uri="postgres:$(get_psql_user_pass ${test_name}-pguser-postgres)@$(get_psql_user_host ${test_name}-pguser-postgres)"

      run_psql_local 'SELECT extname||$$=$$||extversion FROM pg_extension ORDER BY 1' "$uri" \
        | grep -v '^$' > ${TEMP_DIR}/ext.upgraded
      # the cluster upgrade brings newer extension builds and the operator legitimately
      # runs ALTER EXTENSION ... UPDATE — so compare the extension SET only,
      # versions are allowed to move forward (no process substitution: kuttl
      # runs steps with sh, which doesn't support it)
      cut -d= -f1 ${TEMP_DIR}/ext.before > ${TEMP_DIR}/extnames.before
      cut -d= -f1 ${TEMP_DIR}/ext.upgraded > ${TEMP_DIR}/extnames.upgraded
      diff -u ${TEMP_DIR}/extnames.before ${TEMP_DIR}/extnames.upgraded \
        || { echo "ERROR: extension set changed after cluster upgrade"; exit 1; }

      # poll instead of a fixed sleep — pg_cron fires on minute boundaries and
      # the primary may still be settling right after the cluster upgrade rollout
      fresh=0
      for i in $(seq 1 12); do
          fresh=$(run_psql_local 'SELECT count(*) FROM cron_log WHERE ts > now() - interval $$2 minutes$$' "$uri" | tr -d '[:space:]')
          [[ "$fresh" -ge 1 ]] && break
          sleep 15
      done
      [[ "$fresh" -ge 1 ]] || { echo "ERROR: pg_cron stopped ticking after cluster upgrade"; exit 1; }

      vec=$(run_psql_local 'SELECT count(*) FROM vec' "$uri" | tr -d '[:space:]')
      [[ "$vec" == "1" ]] || { echo "ERROR: vector data lost after cluster upgrade"; exit 1; }
