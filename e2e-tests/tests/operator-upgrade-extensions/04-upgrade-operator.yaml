apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 240
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      snapshot_workload_revisions ${test_name} ${TEMP_DIR}/revisions.before
      date -u +%Y-%m-%dT%H:%M:%SZ > ${TEMP_DIR}/update_ts.txt

      update_operator
      kubectl wait -n ${OPERATOR_NS:-$NAMESPACE} --timeout 60s \
        --for=jsonpath='{.spec.template.spec.containers[0].image}'=$IMAGE deployment/percona-postgresql-operator

      sleep 90 # reconcile cycles + one cron minute boundary
