apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 420
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pg_ver_lower="$(cat ${TEMP_DIR}/pg_ver.txt)"
      target_image_postgresql=$IMAGE_POSTGRESQL
      target_image_pgbouncer=$IMAGE_PGBOUNCER
      target_image_backrest=$IMAGE_BACKREST

      if [ "$pg_ver_lower" != "$PG_VER" ]; then
          target_image_postgresql="${REGISTRY_NAME_FULL}perconalab/percona-postgresql-operator:main-ppg$pg_ver_lower-postgres"
          target_image_pgbouncer="${REGISTRY_NAME_FULL}perconalab/percona-postgresql-operator:main-pgbouncer$pg_ver_lower"
          target_image_backrest="${REGISTRY_NAME_FULL}perconalab/percona-postgresql-operator:main-pgbackrest$pg_ver_lower"
      fi

      cr_ver=$(yq '.spec.crVersion' $DEPLOY_DIR/cr.yaml)

      kubectl -n "${NAMESPACE}" patch perconapgcluster ${test_name} --type merge -p '{
        "spec": {
          "crVersion": "'${cr_ver}'",
          "image": "'${target_image_postgresql}'",
          "proxy": {"pgBouncer": {"image": "'${target_image_pgbouncer}'"}},
          "backups": {"pgbackrest": {"image": "'${target_image_backrest}'"}},
          "extensions": {"image": "'${IMAGE}'"},
          "initContainer": {"image": "'${IMAGE}'"}
        }
      }'
      sleep 7 # wait for reconcile loop

      for s in $(kubectl get sts -n $NAMESPACE --no-headers -l postgres-operator.crunchydata.com/instance-set=instance1 --output=custom-columns='NAME:.metadata.name'); do
          kubectl wait -n $NAMESPACE --timeout 300s --for=jsonpath='{.spec.template.spec.containers[?(@.name=="database")].image}'=$target_image_postgresql sts/$s
      done
      wait_cluster_consistency ${test_name}
