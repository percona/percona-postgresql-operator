apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: check-operator-and-minio
timeout: 180
commands:
  - script: |
      set -o errexit
      set -o xtrace

      source ../../functions

      until kubectl assert exist-enhanced deployment percona-postgresql-operator \
        -n "${OPERATOR_NS:-$NAMESPACE}" --field-selector status.readyReplicas=1; do
        echo "Waiting for percona-postgresql-operator deployment"
        sleep 5
      done

      if [[ ${ARCH} == arm64 ]]; then
        exit 0
      fi

      until kubectl assert exist-enhanced deployment s3-storage-all-in-one \
        -n "${NAMESPACE}" --field-selector status.readyReplicas=1; do
        echo "Waiting for s3-storage-all-in-one deployment"
        sleep 5
      done
