apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 90
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping operator-upgrade-extensions on arm64: pg_cron-*-arm64.tar.gz is not in extension storage"
        exit 0
      fi

      check_logs_for_errors ${test_name} "$(cat ${TEMP_DIR}/update_ts.txt)" ../../tests/operator-upgrade-extensions/conf/log-allowlist.txt
