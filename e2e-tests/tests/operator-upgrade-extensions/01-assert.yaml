apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping operator-upgrade-extensions on arm64: pg_cron-*-arm64.tar.gz is not in extension storage"
        exit 0
      fi

      wait_cluster_consistency operator-upgrade-extensions 60
