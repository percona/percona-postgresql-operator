apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping operator-upgrade-extensions on arm64: pg_cron-*-arm64.tar.gz is not in extension storage"
        exit 0
      fi

      kubectl -n ${NAMESPACE} patch postgrescluster operator-upgrade-extensions --type=merge -p='{"metadata":{"finalizers":[]}}' 2>/dev/null || true
      kubectl -n ${NAMESPACE} delete postgrescluster operator-upgrade-extensions --ignore-not-found || true
      kubectl -n "${NAMESPACE}" delete pg operator-upgrade-extensions --ignore-not-found || true
      remove_all_finalizers
      check_operator_panic
      destroy_operator
    timeout: 60
