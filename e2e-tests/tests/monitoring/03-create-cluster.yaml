apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - timeout: 120
    script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      get_cr \
        | yq eval '.spec.pmm.enabled=true' - \
        | yq eval ".spec.pmm.image=\"${IMAGE_PMM_CLIENT}\"" - \
        | kubectl -n "${NAMESPACE}" apply -f -
