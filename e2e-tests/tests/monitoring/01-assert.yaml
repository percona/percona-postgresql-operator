apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 520
commands:
  - script: |
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      set +o errexit
      set +o xtrace

      load_balancer=""
      until [ -n "${load_balancer}" ]; do
        load_balancer=$(kubectl get service monitoring-service -n "${NAMESPACE}" -o json \
          | jq -r '.status.loadBalancer.ingress[0] | .ip // .hostname // empty')
        [ -n "${load_balancer}" ] || sleep 5
      done

      set -o errexit

      until kubectl assert exist-enhanced statefulset monitoring -n "${NAMESPACE}" \
        --field-selector status.readyReplicas=1; do
        echo "Waiting for PMM server statefulset"
        sleep 5
      done
