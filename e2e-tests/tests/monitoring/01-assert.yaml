apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 520
commands:
  - script: |
      set +o xtrace

      load_balancer=""
      until [ -n "${load_balancer}" ]; do
        load_balancer=$(kubectl get service monitoring-service -n "${NAMESPACE}" -o json \
          | jq -r '.status.loadBalancer.ingress[0] | .ip // .hostname // empty')
        [ -n "${load_balancer}" ] || sleep 5
      done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: monitoring
status:
  collisionCount: 0
  currentReplicas: 1
  observedGeneration: 1
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
kind: Service
apiVersion: v1
metadata:
  name: monitoring-service
