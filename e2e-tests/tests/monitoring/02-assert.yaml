apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      kubectl assert exist-enhanced secret monitoring-pmm-secret -n "${NAMESPACE}"
