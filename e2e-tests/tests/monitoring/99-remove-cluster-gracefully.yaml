apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      kubectl -n "${NAMESPACE}" delete pg monitoring --ignore-not-found || true
      remove_all_finalizers
      check_operator_panic
      destroy_operator
    timeout: 60
