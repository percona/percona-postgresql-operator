apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 420
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      wait_cluster_consistency monitoring 42

      kubectl assert exist-enhanced perconapgcluster monitoring -n "${NAMESPACE}" \
        --field-selector status.state=ready

      sts=$(kubectl -n "${NAMESPACE}" get sts \
        --selector=postgres-operator.crunchydata.com/instance-set=instance1 \
        -o jsonpath='{.items[*].metadata.name}')
      for st in $sts; do
        kubectl assert exist-enhanced statefulset "${st}" -n "${NAMESPACE}" \
          --field-selector status.observedGeneration=2 \
          --field-selector status.readyReplicas=1
      done
