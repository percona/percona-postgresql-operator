apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      kubectl create -n "${NAMESPACE}" secret generic monitoring-pmm-secret --from-literal=PMM_SERVER_TOKEN="" || true
