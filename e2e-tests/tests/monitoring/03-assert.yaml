apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 420
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${ARCH} == arm64 ]]; then
        echo "Skipping monitoring test on arm64: PMM server does not support ARM"
        exit 0
      fi

      wait_cluster_consistency monitoring 42

      pmm=$(kubectl -n "${NAMESPACE}" get pg monitoring \
        -o jsonpath='{.spec.pmm.enabled},{.spec.pmm.secret},{.spec.pmm.serverHost},{.spec.pmm.customClusterName},{.spec.pmm.postgresParams}')
      if [[ ${pmm} != "true,monitoring-pmm-secret,monitoring-service,monitoring-pmm-custom-name,--environment=dev-postgres" ]]; then
        echo "Unexpected PMM spec: ${pmm}"
        exit 1
      fi

      retry 30 10 bash -c '
        kubectl -n "'"${NAMESPACE}"'" get pg-backup \
          -o jsonpath="{.items[*].status.state}" | grep -qw Succeeded
      '
