apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 480
commands:
  - script: |-
      set -o errexit

      source ../../functions

      echo "Waiting for standby cluster to be ready"
      kubectl wait --for=jsonpath='{.status.state}'=ready --timeout=480s -n "${NAMESPACE}" pg/standby-cluster

      if [[ ${PG_VER} -ge 17 ]]; then
        wait_pg_condition "standby-cluster" "PGTDEEnabled" "True" "Enabled" "pg_tde is enabled in PerconaPGCluster" "3"
        wait_pg_condition "standby-cluster" "PGTDEVaultProviderReady" "True" "Configured" "pg_tde vault key provider matches the spec" "3"
      fi

      until assert_standby_promotion "standby-cluster"; do
        echo "Waiting standby promotion in standby cluster"
        sleep 5
      done

      echo "Standby promotion reached in standby cluster"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
  ownerReferences:
  - apiVersion: upstream.pgv2.percona.com/v1beta1
    blockOwnerDeletion: true
    controller: true
    kind: PostgresCluster
    name: standby-cluster
status:
  availableReplicas: 1
  currentReplicas: 1
  readyReplicas: 1
  replicas: 1
  updatedReplicas: 1
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: standby-cluster-pgbouncer
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/role: pgbouncer
  ownerReferences:
    - apiVersion: upstream.pgv2.percona.com/v1beta1
      kind: PostgresCluster
      name: standby-cluster
      controller: true
      blockOwnerDeletion: true
status:
  observedGeneration: 1
  replicas: 3
  updatedReplicas: 3
  readyReplicas: 3
---
kind: Job
apiVersion: batch/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: standby-cluster
    postgres-operator.crunchydata.com/pgbackrest: ''
    postgres-operator.crunchydata.com/pgbackrest-backup: replica-create
    postgres-operator.crunchydata.com/pgbackrest-repo: repo1
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGBackup
      controller: true
      blockOwnerDeletion: true
status:
  succeeded: 1
---
apiVersion: upstream.pgv2.percona.com/v1beta1
kind: PostgresCluster
metadata:
  name: standby-cluster
  ownerReferences:
    - apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      name: standby-cluster
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - postgres-operator.crunchydata.com/finalizer
status:
  instances:
    - name: instance1
      readyReplicas: 3
      replicas: 3
      updatedReplicas: 3
  observedGeneration: 2
  pgbackrest:
    repos:
      - name: repo1
        stanzaCreated: true
  proxy:
    pgBouncer:
      readyReplicas: 3
      replicas: 3
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: standby-cluster
spec:
  standby:
    enabled: false
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready
