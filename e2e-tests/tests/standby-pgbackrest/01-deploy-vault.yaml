apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        echo "Skipping Vault deployment for PostgreSQL ${PG_VER}"
        exit 0
      fi

      start_vault vault-service https
    timeout: 600
