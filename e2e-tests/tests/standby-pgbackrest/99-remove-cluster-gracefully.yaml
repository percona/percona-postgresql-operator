apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 300
delete:
- apiVersion: pgv2.percona.com/v2
  kind: PerconaPGCluster
  metadata:
    name: source-cluster
- apiVersion: upstream.pgv2.percona.com/v1beta1
  kind: PostgresCluster
  name: source-cluster
- apiVersion: pgv2.percona.com/v2
  kind: PerconaPGCluster
  metadata:
    name: standby-cluster
- apiVersion: upstream.pgv2.percona.com/v1beta1
  kind: PostgresCluster
  name: standby-cluster
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      if [[ ${PG_VER} -ge 17 ]]; then
        stop_vault "vault-service"
      fi
      remove_all_finalizers
      check_operator_panic
      destroy_operator
    timeout: 60
