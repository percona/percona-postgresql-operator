apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 30
commands:
  - script: |-
      set -o errexit

      source ../../functions

      if [[ ${PG_VER} -lt 17 ]]; then
        exit 0
      fi

      assert_configmap_data 13-verify-extension-standby pg_tde_extension ' pg_tde'
      assert_configmap_data 13-verify-encryption-standby pg_tde_is_encrypted ' t'
      assert_configmap_data 13-verify-wal-encryption-standby pg_tde_wal_encrypt ' on'
      assert_configmap_data 13-verify-encryption-standby2 pg_tde_is_encrypted ' t'
