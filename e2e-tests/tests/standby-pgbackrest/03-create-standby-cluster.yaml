apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 20
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      repo_path=$(kubectl get pg -n "${NAMESPACE}" source-cluster -o jsonpath='{.spec.backups.pgbackrest.global.repo1-path}')
      tde_params='.'
      if [[ ${PG_VER} -ge 17 ]]; then
        tde_params='
          .spec.extensions.pg_tde.enabled = true |
          .spec.extensions.pg_tde.walEncryption = true |
          .spec.extensions.pg_tde.vault.host = "https://vault-service.vault.svc:8200" |
          .spec.extensions.pg_tde.vault.mountPath = "tde" |
          .spec.extensions.pg_tde.vault.tokenSecret.name = "vault-secret" |
          .spec.extensions.pg_tde.vault.tokenSecret.key = "token" |
          .spec.extensions.pg_tde.vault.caSecret.name = "vault-secret" |
          .spec.extensions.pg_tde.vault.caSecret.key = "ca.crt"
        '
      fi

      get_cr "standby-cluster" \
        | yq eval ".spec.backups.pgbackrest.global.repo1-path = \"${repo_path}\"" - \
        | yq eval '.spec.standby.enabled = true' - \
        | yq eval '.spec.standby.repoName = "repo1"' - \
        | yq eval '.spec.standby.maxAcceptableLag = "1Ki"' - \
        | yq eval "${tde_params}" - \
        | kubectl -n "${NAMESPACE}" apply -f -
