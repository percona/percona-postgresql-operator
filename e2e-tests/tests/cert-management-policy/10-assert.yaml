apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 600
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      certificates=$(kubectl -n "$NAMESPACE" get certificate -o name)
      if [[ -n "$certificates" ]]; then
        echo "Certificate resources were generated in userProvidedOnly mode: $certificates" >&2
        exit 1
      fi
resourceRefs:
  - apiVersion: pgv2.percona.com/v2
    kind: PerconaPGCluster
    name: cert-management-policy
    ref: cluster
assertAll:
  - celExpr: cluster.status.conditions.exists(c, c.type == "ReadyForBackup" && c.status == "True" && has(c.observedGeneration) && c.observedGeneration == cluster.metadata.generation)
    message: ReadyForBackup should be True
  - celExpr: cluster.status.conditions.exists(c, c.type == "TLSSecretsReady" && c.status == "True" && c.reason == "TLSSecretsFound" && has(c.observedGeneration) && c.observedGeneration == cluster.metadata.generation)
    message: TLSSecretsReady should be True with reason TLSSecretsFound
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-management-policy-cluster-ca-cert
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-management-policy-cluster-cert
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-management-policy-replication-cert
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-management-policy-pgbackrest
---
apiVersion: v1
kind: Secret
metadata:
  name: cert-management-policy-pgbouncer
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: cert-management-policy-pgbouncer
status:
  replicas: 1
  readyReplicas: 1
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: cert-management-policy
status:
  pgbouncer:
    ready: 1
    size: 1
  postgres:
    ready: 3
    size: 3
  state: ready
