apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 180
commands:
  - script: |-
      set -o errexit
      set -o pipefail

      kubectl -n "${NAMESPACE}" get perconapgcluster cert-management-policy -o json \
        | jq -e '
            .status.conditions |
            any(.[]; .type == "ReadyForBackup" and .status == "False" and .reason == "PGBackRestRepoHostReady") and
            any(.[]; .type == "TLSSecretsReady" and .status == "False" and .reason == "TLSSecretsMissing") and
            any(.[]; .type == "Progressing" and .status == "False" and .reason == "Paused")
          ' >/dev/null
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  labels:
    postgres-operator.crunchydata.com/cluster: cert-management-policy
    postgres-operator.crunchydata.com/data: postgres
    postgres-operator.crunchydata.com/instance-set: instance1
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: cert-management-policy
