apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o pipefail
      set -o xtrace

      source ../../functions

      cluster="cert-management-policy"

      # TODO: The user should know the PostgresCluster UID after the cluster is
      # created so that the pgBackRest client certificate can use it.
      cluster_uid=$(kubectl -n "$NAMESPACE" get postgrescluster "$cluster" \
        -o jsonpath='{.metadata.uid}')
      pgbackrest_client="pgbackrest@${cluster_uid}"

      issue_certificate pgbackrest-client \
        "$pgbackrest_client" clientAuth "$pgbackrest_client"

      pgbackrest_cert=$(base64 <"$TEMP_DIR/pgbackrest-client.crt" \
        | tr -d '\n')
      pgbackrest_key=$(base64 <"$TEMP_DIR/pgbackrest-client.key" \
        | tr -d '\n')
      kubectl -n "$NAMESPACE" get secret "${cluster}-pgbackrest" -o yaml \
        | pgbackrest_cert="$pgbackrest_cert" pgbackrest_key="$pgbackrest_key" \
          yq eval '
            .data."pgbackrest-client.crt" = strenv(pgbackrest_cert) |
            .data."pgbackrest-client.key" = strenv(pgbackrest_key) |
            del(
              .metadata.creationTimestamp,
              .metadata.managedFields,
              .metadata.resourceVersion,
              .metadata.uid
            )
          ' - \
        | kubectl -n "$NAMESPACE" apply -f -

      secret="${cluster}-pgbackrest"
      checksum=$(kubectl -n "$NAMESPACE" get secret "$secret" -o json \
        | jq --compact-output --sort-keys '.data' \
        | sha256sum | awk '{print $1}')
      kubectl -n "$NAMESPACE" annotate secret "$secret" \
        e2e.percona.com/secret-checksum="$checksum" \
        --overwrite
