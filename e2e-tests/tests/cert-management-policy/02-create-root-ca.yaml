apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o pipefail
      set -o xtrace

      source ../../functions

      cluster="cert-management-policy"

      issue_root_ca

      kubectl -n "$NAMESPACE" create secret generic "${cluster}-cluster-ca-cert" \
        --from-file=root.crt="$TEMP_DIR/root-ca.crt" \
        --from-file=root.key="$TEMP_DIR/root-ca.key" \
        --dry-run=client -o yaml \
        | kubectl label --local -f - -o yaml \
          postgres-operator.crunchydata.com/cluster="$cluster" \
        | kubectl -n "$NAMESPACE" apply -f -

      secret="${cluster}-cluster-ca-cert"
      checksum=$(kubectl -n "$NAMESPACE" get secret "$secret" -o json \
        | jq --compact-output --sort-keys '.data' \
        | sha256sum | awk '{print $1}')
      kubectl -n "$NAMESPACE" annotate secret "$secret" \
        e2e.percona.com/secret-checksum="$checksum" \
        --overwrite
