apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o pipefail

      kubectl -n "${NAMESPACE}" get perconapgcluster cert-management-policy -o json \
        | jq -e '
            .status.conditions |
            any(.[]; .type == "ReadyForBackup" and .status == "False" and .reason == "PGBackRestRepoHostReady") and
            any(.[]; .type == "TLSSecretsReady" and .status == "False" and .reason == "TLSSecretsMissing") and
            any(.[]; .type == "Progressing" and .status == "False" and .reason == "Paused")
          ' >/dev/null
