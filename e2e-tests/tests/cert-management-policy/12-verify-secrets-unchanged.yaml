apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |-
      set -o errexit
      set -o pipefail
      set -o xtrace

      source ../../functions

      cluster="cert-management-policy"

      assert_secret_unchanged() {
        local secret="$1"
        local expected
        local actual

        expected=$(kubectl -n "$NAMESPACE" get secret "$secret" \
          -o jsonpath='{.metadata.annotations.e2e\.percona\.com/secret-checksum}')
        actual=$(kubectl -n "$NAMESPACE" get secret "$secret" -o json \
          | jq --compact-output --sort-keys '.data' \
          | sha256sum | awk '{print $1}')

        if [[ -z "$expected" || "$actual" != "$expected" ]]; then
          echo "User-provided Secret changed: $secret" >&2
          echo "Expected checksum: ${expected:-missing}" >&2
          echo "Actual checksum: $actual" >&2
          return 1
        fi
      }

      assert_secret_unchanged "${cluster}-cluster-ca-cert"
      assert_secret_unchanged "${cluster}-cluster-cert"
      assert_secret_unchanged "${cluster}-replication-cert"
      assert_secret_unchanged "${cluster}-pgbackrest"
      assert_secret_unchanged "${cluster}-pgbouncer"

      statefulsets=$(kubectl -n "$NAMESPACE" get statefulset \
        -l postgres-operator.crunchydata.com/cluster="$cluster",postgres-operator.crunchydata.com/data=postgres \
        -o json)
      jq -e '.items | length == 3' <<<"$statefulsets" >/dev/null
      instances=$(jq -r '.items[].metadata.name' <<<"$statefulsets" | sort)
      for instance in $instances; do
        assert_secret_unchanged "${instance}-certs"
      done
