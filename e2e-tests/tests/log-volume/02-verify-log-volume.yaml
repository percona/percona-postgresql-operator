apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 120
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pvcs=$(kubectl -n "${NAMESPACE}" get pvc \
        --selector postgres-operator.crunchydata.com/role=pglogs \
        -o custom-columns='NAME:.metadata.name' --no-headers)
      if [[ -z ${pvcs} ]]; then
        echo "no log PVC was created"
        exit 1
      fi
      for pvc in ${pvcs}; do
        kubectl -n "${NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Bound \
          "pvc/${pvc}" --timeout=120s
      done

      sts=$(kubectl -n "${NAMESPACE}" get sts \
        --selector postgres-operator.crunchydata.com/instance-set=instance1 -o json)

      printf '%s\n' "${sts}" | jq -e '.items[0].spec.template.spec.volumes[]
        | select(.name == "postgres-logs") | select(.persistentVolumeClaim != null)' >/dev/null
      printf '%s\n' "${sts}" | jq -e '.items[0].spec.template.spec.containers[]
        | select(.name == "database") | .volumeMounts[]
        | select(.mountPath == "/pglogs")' >/dev/null
      printf '%s\n' "${sts}" | jq -e '.items[0].spec.template.spec.initContainers[]
        | select(.name == "postgres-startup") | .volumeMounts[]
        | select(.mountPath == "/pglogs")' >/dev/null

      # The startup command links the log directories on the data volume to the
      # log volume, so nothing else has to be reconfigured to use it.
      for pod in $(get_instance_set_pods instance1); do
        # /proc/mounts guards against a false positive where the mount silently
        # failed and reads/writes land on the container's own filesystem instead.
        kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          grep -q ' /pglogs ' /proc/mounts

        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink /pgdata/logs/postgres)
        if [[ ${target} != "/pglogs/postgres" ]]; then
          echo "${pod}: /pgdata/logs/postgres points at '${target}', want '/pglogs/postgres'"
          exit 1
        fi

        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink /pgdata/pgbackrest/log)
        if [[ ${target} != "/pglogs/pgbackrest/log" ]]; then
          echo "${pod}: /pgdata/pgbackrest/log points at '${target}', want '/pglogs/pgbackrest/log'"
          exit 1
        fi

        kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          test -d /pglogs/postgres -a -d /pglogs/pgbackrest/log
      done
