apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 60
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      data=$(run_psql_local '\c myapp \\\ SELECT * from myApp;' \
        "postgres:$(get_psql_user_pass log-volume-pguser-postgres)@$(get_psql_user_host log-volume-pguser-postgres)")
      kubectl create configmap -n "${NAMESPACE}" 09-verify-restored-data --from-literal=data="${data}"

      # The restore rebuilds the data directory; the log symlinks must be back in place.
      for pod in $(get_instance_set_pods instance1); do
        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink /pgdata/logs/postgres)
        if [[ ${target} != "/pglogs/postgres" ]]; then
          echo "${pod}: /pgdata/logs/postgres points at '${target}' after restore, want '/pglogs/postgres'"
          exit 1
        fi

        target=$(kubectl -n "${NAMESPACE}" exec "${pod}" -c database -- \
          readlink /pgdata/pgbackrest/log)
        if [[ ${target} != "/pglogs/pgbackrest/log" ]]; then
          echo "${pod}: /pgdata/pgbackrest/log points at '${target}' after restore, want '/pglogs/pgbackrest/log'"
          exit 1
        fi
      done
