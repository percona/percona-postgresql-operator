apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 10
commands:
  - script: |-
      set -o errexit
      set -o xtrace

      source ../../functions

      pg_image="${IMAGE_POSTGRESQL13:-$(get_container_image "postgres" 13)}"
      pgbouncer_image="${IMAGE_PGBOUNCER13:-$(get_container_image "pgbouncer" 13)}"
      pgbackrest_image="${IMAGE_BACKREST13:-$(get_container_image "pgbackrest" 13)}"

      get_cr \
        | yq eval '
          .spec.postgresVersion = 13 |
          .spec.image = "'"${pg_image}"'" |
          .spec.instances[0].dataVolumeClaimSpec.resources.requests.storage = "3Gi" |
          .spec.proxy.pgBouncer.image = "'"${pgbouncer_image}"'" |
          .spec.backups.pgbackrest.image = "'"${pgbackrest_image}"'" |
          .spec.patroni.dynamicConfiguration.postgresql.remove_data_directory_on_diverged_timelines = true' \
        | kubectl -n "${NAMESPACE}" apply -f -
