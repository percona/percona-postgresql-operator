apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 900
commands:
- script: |-
    kubectl -n ${NAMESPACE} get pg,pod,job
    sleep 5
collectors:
- type: pod
  selector: "postgres-operator.crunchydata.com/role=pgupgrade"
  tail: 100
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: major-upgrade-13-to-14
spec:
  postgresVersion: 14
status:
  pgbouncer:
    ready: 3
    size: 3
  postgres:
    instances:
    - name: instance1
      ready: 3
      size: 3
    ready: 3
    size: 3
  state: ready
---
apiVersion: pgv2.percona.com/v2
kind: PerconaPGUpgrade
metadata:
  name: 13-to-14
status:
  conditions:
  - type: Progressing
    reason: PGUpgradeCompleted
    status: "False"
    observedGeneration: 1
  - type: Succeeded
    reason: PGUpgradeSucceeded
    status: "True"
    observedGeneration: 1
  observedGeneration: 1
